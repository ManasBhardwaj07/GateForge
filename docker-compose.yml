version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateforge_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mock-orders:
    build: ./apps/mock-orders
    command: npm run dev
    ports:
      - '5001:5001'
    depends_on:
      - redis

  mock-payments:
    build: ./apps/mock-payments
    command: npm run dev
    ports:
      - '5002:5002'
    depends_on:
      - redis

  gateway:
    build: ./apps/gateway
    command: npm run dev
    ports:
      - '4000:4000'
      - '4001:4001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gateforge_dev
      REDIS_URL: redis://redis:6379
      ALLOW_PRIVATE_UPSTREAMS: '1'
    depends_on:
      - mock-orders
      - mock-payments
      - redis
      - postgres

  dashboard:
    build: ./apps/dashboard
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_CONTROL_API: http://localhost:4001/control
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
    depends_on:
      - gateway

volumes:
  pgdata:
