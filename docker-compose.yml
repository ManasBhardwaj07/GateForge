version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateforge_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateforge_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gateforge_dev
      NODE_ENV: development
    command: sh -c "npm install && cd packages/db && npx prisma db push && npm run seed"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-orders:
    build: ./apps/mock-orders
    command: npm run dev
    ports:
      - '5001:5001'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-payments:
    build: ./apps/mock-payments
    command: npm run dev
    ports:
      - '5002:5002'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5002/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: ./apps/gateway
    command: npm run dev
    ports:
      - '4000:4000'
      - '4001:4001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gateforge_dev
      REDIS_URL: redis://redis:6379
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS}
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      mock-orders:
        condition: service_healthy
      mock-payments:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./apps/dashboard
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      INTERNAL_CONTROL_API_URL: http://gateway:4001/control
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
